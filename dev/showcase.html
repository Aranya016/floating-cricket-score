<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Showcase (for the README screenshot)</title>
  <script src="/dev/chrome-mock.js"></script>
  <style>
    body { margin: 0; width: 760px; padding: 28px; box-sizing: border-box; background: linear-gradient(135deg, #1d2939, #101828); font: 13px system-ui, "Segoe UI", sans-serif; color: #d0d5dd; }
    .row { display: flex; gap: 28px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; color: #98a2b3; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    .win { border-radius: 10px; overflow: hidden; box-shadow: 0 18px 40px rgba(0, 0, 0, .45); border: 1px solid #344054; background: #0f131b; }
    .chrome { height: 28px; display: flex; align-items: center; padding: 0 10px; gap: 8px; background: #1f242f; color: #98a2b3; font-size: 12px; }
    .chrome b { margin-left: auto; font-weight: 400; letter-spacing: 6px; }
    .compact { width: 280px; height: 64px; }
    .full { width: 300px; }
  </style>
</head>
<body>
  <div class="row">
    <figure>
      <figcaption>Floats above everything</figcaption>
      <div class="win"><div class="chrome">cricinfo.com <b>⤢ ✕</b></div><div class="compact" id="a"></div></div>
    </figure>
    <figure>
      <figcaption>Click it for details</figcaption>
      <div class="win"><div class="chrome">cricinfo.com <b>⤢ ✕</b></div><div class="full" id="b"></div></div>
    </figure>
  </div>
  <script src="/cricket-float/widget.js"></script>
  <script>
    (async () => {
      await __mock.ready;
      for (const [id, collapsed] of [['a', true], ['b', false]]) {
        const el = document.getElementById(id);
        const shadow = el.attachShadow({ mode: 'open' });
        CricWidget.adoptStyles(shadow);
        // The floating window's 100vh height doesn't apply inside this mock frame.
        const fix = new CSSStyleSheet();
        fix.replaceSync('.pill.fill { height: 64px; } .card.full { min-height: 0; }');
        shadow.adoptedStyleSheets = [...shadow.adoptedStyleSheets, fix];
        const box = document.createElement('div');
        shadow.append(box);
        CricWidget.render(box, { ...__mock.data.score, fetchedAt: Date.now() }, { mode: 'pip', collapsed });
      }
      document.body.dataset.ready = '1';
    })();
  </script>
</body>
</html>
