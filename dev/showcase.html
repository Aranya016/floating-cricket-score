<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Showcase (for the README screenshot)</title>
  <script src="/dev/chrome-mock.js"></script>
  <style>
    body { margin: 0; width: 760px; padding: 24px; box-sizing: border-box; background: #e4e7ec; font: 13px system-ui, "Segoe UI", sans-serif; }
    .row { display: flex; gap: 24px; }
    figure { margin: 0; flex: 1; }
    figcaption { margin-bottom: 8px; color: #475467; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .browser { position: relative; height: 300px; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 10px 28px rgba(16, 24, 40, .18); }
    .tabbar { height: 30px; background: #f2f4f7; border-bottom: 1px solid #eaecf0; display: flex; align-items: center; padding: 0 10px; gap: 6px; }
    .tabbar i { width: 9px; height: 9px; border-radius: 50%; background: #d0d5dd; }
    .tabbar span { margin-left: 10px; flex: 1; height: 16px; border-radius: 8px; background: #fff; }
    .page { padding: 18px 20px; }
    .page b { display: block; height: 14px; width: 70%; border-radius: 4px; background: #d0d5dd; margin-bottom: 14px; }
    .page p { height: 8px; border-radius: 4px; background: #eaecf0; margin: 0 0 9px; }
    .widget { position: absolute; right: 12px; bottom: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <figure>
      <figcaption>On every tab</figcaption>
      <div class="browser"><div class="tabbar"><i></i><i></i><i></i><span></span></div>
        <div class="page"><b></b><p></p><p></p><p style="width:85%"></p><p></p><p style="width:60%"></p><p></p><p style="width:90%"></p></div>
        <div class="widget" id="a"></div></div>
    </figure>
    <figure>
      <figcaption>Click it for details</figcaption>
      <div class="browser"><div class="tabbar"><i></i><i></i><i></i><span></span></div>
        <div class="page"><b></b><p></p><p></p><p style="width:85%"></p><p></p><p style="width:60%"></p></div>
        <div class="widget" id="b"></div></div>
    </figure>
  </div>
  <script src="/cricket-float/widget.js"></script>
  <script>
    (async () => {
      await __mock.ready;
      for (const [id, collapsed] of [['a', true], ['b', false]]) {
        const shadow = document.getElementById(id).attachShadow({ mode: 'open' });
        CricWidget.adoptStyles(shadow);
        const box = document.createElement('div');
        shadow.append(box);
        CricWidget.render(box, { ...__mock.data.score, fetchedAt: Date.now() }, { collapsed });
      }
      document.body.dataset.ready = '1';
    })();
  </script>
</body>
</html>
