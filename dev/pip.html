<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Floating window (preview)</title>
  <script src="/dev/chrome-mock.js"></script>
  <style>html, body { margin: 0; background: #0f131b; }</style>
</head>
<body>
  <div id="host"></div>
  <script src="/cricket-float/widget.js"></script>
  <script>
    // Renders what the floating window shows. ?compact=1 for score-only, &flash=W|4|6.
    (async () => {
      const q = new URLSearchParams(location.search);
      await __mock.ready;
      const shadow = document.getElementById('host').attachShadow({ mode: 'open' });
      CricWidget.adoptStyles(shadow);
      const box = document.createElement('div');
      shadow.append(box);
      CricWidget.render(box, __mock.data.score, { mode: 'pip', collapsed: q.get('compact') === '1', flash: q.get('flash') });
    })();
  </script>
</body>
</html>
