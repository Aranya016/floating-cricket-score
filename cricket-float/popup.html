<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Floating Cricket Score</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Floating Score</h1>
    <label class="switch" title="Show the score on your tabs (Alt+Shift+C)">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <div id="current"></div>
  <div class="row">
    <button id="refresh">Refresh now</button>
  </div>

  <button id="this-window" class="wide" hidden>Show the score in this window</button>
  <button id="this-tab" class="wide" hidden></button>
  <p id="err" class="err" hidden></p>

  <h2>Pick a match <button id="reload-list" class="link" title="Reload list">↻</button></h2>
  <ul id="matches"><li class="hint">Loading matches…</li></ul>

  <h2>Or paste a Cricinfo match link</h2>
  <form id="paste">
    <input id="url" type="url" placeholder="https://www.cricinfo.com/series/…" autocomplete="off" spellcheck="false">
    <button type="submit">Follow</button>
  </form>

  <h2>Settings</h2>
  <div class="setting">
    <span>Refresh every</span>
    <select id="interval">
      <option value="15">15 seconds</option>
      <option value="20">20 seconds</option>
      <option value="30">30 seconds</option>
      <option value="60">1 minute</option>
    </select>
  </div>
  <div class="setting"><button id="reset-pos" class="link">Move the score back to the bottom-right corner</button></div>
  <p class="foot">
    <b>Alt+Shift+C</b> shows or hides the score.
    For the fastest updates, keep the match open in a Cricinfo tab (you can pin it).
  </p>

  <script src="parser.js"></script>
  <script src="widget.js"></script>
  <script src="popup.js"></script>
</body>
</html>
